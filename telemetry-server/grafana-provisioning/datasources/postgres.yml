apiVersion: 1

datasources:
  - name: CarRadio Telemetry
    type: postgres
    url: postgres:5432
    user: tm
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: tm
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
